# Configuracion de despliegue en Netlify.
#
# Netlify no trae Flutter preinstalado, asi que el SDK se descarga en cada
# build desde netlify-build.sh. Las credenciales de Supabase se toman de las
# variables de entorno configuradas en el panel de Netlify (nunca del repo).

[build]
  command = "bash netlify-build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.44.6"

# La navegacion la resuelve go_router del lado del cliente: cualquier ruta
# debe servir index.html en lugar de devolver 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad para todas las rutas.
[[headers]]
  for = "/*"
  [headers.values]
    # Mitigacion XSS: evita que navegadores interprete como script/style si
    # no tiene content-type explicito. Los assets de Flutter ya estan hasheados.
    X-Content-Type-Options = "nosniff"

    # Mitigacion clickjacking: nunca permitir enmarcar en un <iframe>.
    X-Frame-Options = "DENY"

    # HSTS: fuerza HTTPS en futuros accesos (un año).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Referrer-Policy: solo enviar referrer si es el mismo origen.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # CSP: restringir a recursos de origenes conocidos. Permite:
    # - self: scripts/styles/images de este dominio
    # - wasm-unsafe-eval: requerido por Flutter Web (CanvasKit/Skwasm)
    # - www.gstatic.com: de aca Flutter Web baja el motor CanvasKit
    #   (canvaskit.js + canvaskit.wasm) en tiempo de ejecucion, no es un
    #   asset que el build empaquete localmente.
    # - fonts.gstatic.com / fonts.googleapis.com: Flutter Web baja la fuente
    #   Roboto de ahi con fetch() en el arranque (via connect-src, no
    #   font-src), aunque la app no declare ninguna fuente custom propia.
    #   Es un subdominio distinto de www.gstatic.com (CanvasKit).
    # Quitar wasm-unsafe-eval/www.gstatic.com solo si se migra a un renderer
    # sin CanvasKit, o se sirve canvaskit desde el propio dominio.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://supabase.co https://*.supabase.co https://fonts.gstatic.com https://fonts.googleapis.com https://www.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Permissions-Policy: deshabilita caracteristicas de navegador que esta app no usa.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
